<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eid-ul-Adha Countdown</title>
<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        background:pink;
        margin-top:100px;
    }
    h1{
        color:red;
    }
    #countdown{
        font-size:30px;
        font-weight:bold;
        color:black;
    }
</style>
</head>
<body>

<h1> 🐄🐪 🌙✨ Eid-ul-Adha Countdown ✨🌙 🐑🐐</h1>
<div id="countdown"></div>

<script>

var eidDate = new Date("May 27, 2026 00:00:00").getTime();

var timer = setInterval(function() {
    var now = new Date().getTime();
    var distance = eidDate - now;

    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("countdown").innerHTML =
        days + "ⓓ " + hours + "ⓗ " + minutes + "ⓜ " + seconds + "ⓢ ";

    if (distance < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML = "🌟🅴🅸🅳 🅼🆄🅱🅰🆁🅰🅺!🌟 <br> 🎊🎉✨☄️💝☄️✨🎉🎊<br>🍨🍧🍿🥤🍩🍰🥧🍡🍥<br>🥪🌮🍕🥘🌯🌭🍔<br> 🍗🍖🥩";
    }
}, 1000);
</script>

</body>
</html>
